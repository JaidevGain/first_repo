<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Clone</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
    
  body{
    background:#f5f5f5;
}

/* NAVBAR */

.navbar{
    background:#d8232a;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.search{
    width:500px;
    padding:10px;
    border:none;
    border-radius:5px;
}

/* MENU */

.menu{
    background:#fff;
    display:flex;
    justify-content:center;
    gap:40px;
    padding:15px;
    font-weight:bold;
}

.menu a{
    text-decoration:none;
    color:black;
}

/* BANNER */

.banner{
    width:90%;
    height:350px;
    margin:20px auto;
    border-radius:15px;
    background:url("https://picsum.photos/1200/350");
    background-size:cover;
    background-position:center;
}

/* MOVIE SECTION */

.heading{
    margin:30px 80px;
    font-size:28px;
}

.movies{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    width:220px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0px 2px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:300px;
}

.info{
    padding:15px;
}

.info h3{
    margin-bottom:8px;
}

.info p{
    color:gray;
}

.btn{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#d8232a;
    color:white;
    border:none;

    border-radius:5px;
}

/* FOOTER */

.footer{
    background:#333;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:40px;
}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">bookmyshow</div>

    <input type="text"
    class="search"
    placeholder="Search Movies, Events, Sports">

    <button style="padding:10px 20px;border:none;border-radius:5px;">
        Sign In
    </button>
</div>

<div class="menu">
    <a href="#">Movies</a>
    <a href="#">Stream</a>
    <a href="#">Events</a>
    <a href="#">Plays</a>
    <a href="#">Sports</a>
    <a href="#">Activities</a>
</div>

<div class="banner"></div>

<h2 class="heading">Recommended Movies</h2>

<div class="movies">

    <div class="card">
        <img src="https://picsum.photos/220/300?1">
        <div class="info">
            <h3>Movie One</h3>
            <p>Action / Thriller</p>
            <button class="btn">Book Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/220/300?2">
        <div class="info">
            <h3>Movie Two</h3>
            <p>Comedy</p>
            <button class="btn">Book Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/220/300?3">
        <div class="info">
            <h3>Movie Three</h3>
            <p>Drama</p>
            <button class="btn">Book Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/220/300?4">
        <div class="info">
            <h3>Movie Four</h3>
            <p>Adventure</p>
            <button class="btn">Book Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://picsum.photos/220/300?5">
        <div class="info">
            <h3>Movie Five</h3>
            <p>Sci-Fi</p>
            <button class="btn">Book Now</button>
        </div>
    </div>

</div>

<div class="footer">
    © 2026 BookMyShow Clone | Made with HTML & CSS
</div>

</body>
</html>
