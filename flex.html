<!DOCTYPE html>
<html>
<head>
    <title>Flex 4 Boxes</title>
    <style>
        .container{
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items:center;
            height: 500px;
             width: 999px; 
            border: 2px solid black;
            background-color: blue;
        }

        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>

</body>
</html>
