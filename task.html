<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequence Boxes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right);
    overflow:hidden;
}

.container{
    position:relative;
    width:1200px;
    height:500px;
}


.box{
    width:100px;
    height:100px;
    position:absolute;
    border:4px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-family:Arial;
    font-weight:bold;
    color:black;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
    transition:0.4s;
}

.box:hover{
    transform:scale(10);
}



.box1{
    background:#ff4b5c;
    top:20px;
    left:100px;
}

.box2{
    background:#ff9f43;
    top:80px;
    left:20px;
}

.box3{
    background:#1dd1a1;
    top:80px;
    left:180px;
}

.box4{
    background:#54a0ff;
    top:150px;
    left:100px;
}
</style>
</head>

<body>

<div class="container">

    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</div>

</body>
</html>
