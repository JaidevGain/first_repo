<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        /* NAVBAR */
        .navbar {
            height: 65px;
            width: 100%;
            background-color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 20px;

            position: sticky;
            top: 0;

            border-bottom: 1px solid lightgray;
        }

        /* LEFT */
        .left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu {
            font-size: 25px;
            cursor: pointer;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: red;
        }

        /* CENTER */
        .center {
            display: flex;
            align-items: center;
        }

        .search {
            width: 450px;
            height: 40px;

            border: 1px solid gray;
            border-radius: 25px 0 0 25px;

            padding-left: 15px;
            font-size: 16px;

            outline: none;
        }

        .search-btn {
            height: 40px;
            width: 70px;

            border: 1px solid gray;
            border-left: none;

            border-radius: 0 25px 25px 0;

            background-color: #f0f0f0;
            cursor: pointer;
        }

        /* RIGHT */
        .right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 24px;
        }

        .icon {
            cursor: pointer;
        }

        /* DUMMY CONTENT */
        .content {
            padding: 20px;
        }

        .box {
            height: 200px;
            background-color: white;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid lightgray;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <!-- LEFT -->
        <div class="left">
            <div class="menu">☰</div>
            <div class="logo">YouTube</div>
        </div>

        <!-- CENTER -->
        <div class="center">
            <input type="text" placeholder="Search YouTube" class="search">
            <button class="search-btn">🔍</button>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="icon">🎥</div>
            <div class="icon">🔔</div>
            <div class="icon">👤</div>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

    </div>

</body>

</html>
