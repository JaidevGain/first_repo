<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Aj</title>
    <style>
        .cont{
         display: grid;
         height:400px;
         width:600px;
         grid-template-columns: 1fr 3fr 1fr;
         grid-template-rows: 1fr 1fr 1fr;
         gap:10px;
         border: 2px solid black;
        }

        .a{
            background-color: aqua;
            height: 40px;
            width:50px;
            align-self: self-end;
            justify-self: self-end;
        }
         .b{
            background-color: red;
            height: 40px;
            width:50px;
            align-self: center;
            justify-self: center;
        }
        .c{
            
            background-color: blue;
            height: 40px;
            width:50px;
            align-self: self-end;
        }
         .d{
            background-color: green;
            height: 40px;
            width:50px;
            align-self: self-start;
            /* justify-self: self-end; */
        }
         .e{
            background-color: yellow;
            height: 40px;
            width:50px;
            align-self: self-end;
            justify-self: center;
        }
         .f{
            background-color: violet;
            height: 40px;
            width:50px;
            /* align-self: self-end; */
            justify-self: self-end;
        }
        .g{
            background-color:brown;
            height: 40px;
            width:50px;
            align-self: center;
            justify-self: self-end;
        }
       
             .h{
            background-color:darkgreen;
            height: 40px;
            width:50px;
            align-self: center;
            /* justify-self: self-end; */
        
        }
        .i{
            background-color: aqua;
            height: 40px;
            width:50px;
            align-self: center;
            /* justify-self: self-end; */
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
        <div class="h"></div>
        <div class="i"></div>
    </div>
    
</body>
</html>
