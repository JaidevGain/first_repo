<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jaidev</title>

    <style>
        .parent {
            width: 1000px;
            height: 500px;
            background-color: green;
            border: 2px solid red;
        }

        .box {
            background-color: yellow;
            border: 2px solid red;
            display: inline-block;
        }

        #box1 {
            height: 100px;
            width: 900px;
            margin: 10px;
        }

        #box2 {
            height: 100px;
            width: 194px;
        }

        #box3 {
            height: 100px;
            width: 758px;
        }
    </style>
</head>

<body>

    <div class="parent">

        <div id="box1" class="box"></div>

        <div id="box2" class="box"></div>

        <div id="box3" class="box"></div>

    </div>

</body>

</html>
