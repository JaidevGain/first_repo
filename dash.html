<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1f2937;
    color:white;
}

/* MAIN GRID */

.container{
    display:grid;

    grid-template-areas:
    "nav nav nav nav"
    "card1 card2 card3 card4"
    "graph graph graph map"
    "visit online sales map";

    grid-template-columns:
    1fr 1fr 1fr 1fr;

    gap:20px;

    padding:20px;
}

/* NAVBAR */

.nav{
    grid-area:nav;
    background:#111827;
    padding:20px;
    border-radius:10px;
}

/* CARDS */

.card{
    padding:25px;
    border-radius:10px;
}

.card h1{
    font-size:40px;
}

.card1{
    grid-area:card1;
    background:#0d6efd;
}

.card2{
    grid-area:card2;
    background:#198754;
}

.card3{
    grid-area:card3;
    background:#ffc107;
    color:black;
}

.card4{
    grid-area:card4;
    background:#dc3545;
}

/* GRAPH */

.graph{
    grid-area:graph;
    background:#374151;
    min-height:350px;
    border-radius:10px;
    padding:20px;
}

/* FAKE GRAPH */

.chart{
    margin-top:20px;
    height:250px;
    position:relative;
    overflow:hidden;
}

.chart::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        to top,
        transparent,
        transparent 49px,
        rgba(255,255,255,.1) 50px
    );
}

.blue-line{
    position:absolute;
    width:100%;
    height:100%;
    border-bottom:4px solid #0d6efd;
    border-radius:50%;
    top:-20px;
}

.green-line{
    position:absolute;
    width:100%;
    height:100%;
    border-bottom:4px solid #20c997;
    border-radius:50%;
    top:20px;
}

/* MAP */

.map{
    grid-area:map;
    background:#2563eb;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
}

/* BOTTOM */

.visitors{
    grid-area:visit;
}

.online{
    grid-area:online;
}

.sales{
    grid-area:sales;
}

.small{
    background:#374151;
    border-radius:10px;
    padding:20px;
    text-align:center;
}

.small h2{
    margin-top:10px;
}

.spark{
    height:40px;
    border-bottom:3px solid white;
}

@media(max-width:900px){

.container{

grid-template-areas:

"nav"
"card1"
"card2"
"card3"
"card4"
"graph"
"map"
"visit"
"online"
"sales";

grid-template-columns:1fr;

}

}

</style>
</head>
<body>

<div class="container">

<div class="nav">
    <h2>Dashboard</h2>
</div>

<div class="card card1">
    <h1>150</h1>
    <p>New Orders</p>
</div>

<div class="card card2">
    <h1>53%</h1>
    <p>Bounce Rate</p>
</div>

<div class="card card3">
    <h1>44</h1>
    <p>User Registrations</p>
</div>

<div class="card card4">
    <h1>65</h1>
    <p>Unique Visitors</p>
</div>

<div class="graph">

    <h2>Sales Value</h2>

    <div class="chart">
        <div class="blue-line"></div>
        <div class="green-line"></div>
    </div>

</div>

<div class="map">
    🌍
</div>

<div class="small visitors">
    <div class="spark"></div>
    <h2>Visitors</h2>
</div>

<div class="small online">
    <div class="spark"></div>
    <h2>Online</h2>
</div>

<div class="small sales">
    <div class="spark"></div>
    <h2>Sales</h2>
</div>

</div>

</body>
</html>
